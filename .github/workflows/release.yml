name: Build Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: h3x-windows-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - name: Test setup verification and silent install flow
        shell: powershell
        run: ./setup/Verify-Setup.ps1
      - run: npm run dist:win
      - name: Verify the bundled setup downloads from GitHub
        shell: pwsh
        run: |
          $exe = (Resolve-Path release/H3X-Setup.exe).Path
          $report = Join-Path $env:RUNNER_TEMP 'h3x-setup-verification.json'
          $process = Start-Process -FilePath $exe -ArgumentList '--verify-download', "`"$report`"" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $report -ErrorAction SilentlyContinue; throw 'Setup download verification failed.' }
          $result = Get-Content $report | ConvertFrom-Json
          if (-not $result.verified) { throw 'Setup did not verify the installer.' }
      - uses: actions/upload-artifact@v4
        with:
          name: H3X-Windows-Installers
          if-no-files-found: error
          path: |
            release/*.exe
            release/SHA256SUMS.txt
      - name: Publish new version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable package version is required.' }
          $tag = "v$version"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { Write-Host 'Version already published; use a new version for the next release.'; exit 0 }
            gh release upload $tag "release/H3X-Setup.exe" "release/H3X-Setup-$version.exe" "release/H3X-Searcher-Setup-$version-x64.exe" "release/SHA256SUMS.txt" --clobber
          } else {
            gh release create $tag "release/H3X-Setup.exe" "release/H3X-Setup-$version.exe" "release/H3X-Searcher-Setup-$version-x64.exe" "release/SHA256SUMS.txt" --target $env:GITHUB_SHA --draft --title "H3X Searcher $version" --notes "Download H3X-Setup.exe for the black-and-white setup. Install and Repair / Update fetch the latest stable installer from lez337/H3X-v2, verify SHA-256 and size, install silently, and leave H3X closed. The full versioned installer supports offline installation. Includes the latest dashboard, search, map, file search and investigation updates. Binaries are unsigned."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
